<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vibedraw — boxes, arrows, text → ASCII</title>
</head>
<body>
<header id="toolbar">
  <div class="brand">vibe<span>draw</span></div>
  <div class="group" id="projectbar">
    <select id="project" title="Switch project"></select>
    <button id="proj-new" title="New project">New</button>
    <button id="proj-rename" title="Rename current project">Rename</button>
    <button id="proj-delete" title="Delete current project">Delete</button>
  </div>
  <div class="group" id="tools">
    <button data-tool="select" title="Select / move / resize (V)">⬚ Select <kbd>V</kbd></button>
    <button data-tool="box" title="Draw box (B)">▭ Box <kbd>B</kbd></button>
    <button data-tool="arrow" title="Draw arrow (A)">→ Arrow <kbd>A</kbd></button>
    <button data-tool="text" title="Place text (T)">T Text <kbd>T</kbd></button>
  </div>
  <div class="group">
    <button id="undo" title="Undo (Ctrl+Z)">↩ Undo</button>
    <button id="redo" title="Redo (Ctrl+Shift+Z)">↪ Redo</button>
    <button id="delete" title="Delete selection (Del)">✕ Delete</button>
    <button id="clear" title="Clear canvas">Clear</button>
  </div>
  <div class="spacer"></div>
  <div class="group" id="zoomer">
    <button id="zoom-out" title="Zoom out (Cmd/Ctrl −)">−</button>
    <button id="zoom-reset" title="Reset zoom (Cmd/Ctrl 0) · Cmd/Ctrl+scroll to zoom at cursor">100%</button>
    <button id="zoom-in" title="Zoom in (Cmd/Ctrl +)">+</button>
  </div>
  <button id="export" class="primary" title="Copy ASCII to clipboard (E) · Shift+click: preview / download">Export ASCII <kbd>E</kbd></button>
</header>

<main id="stage">
  <div id="world">
    <canvas id="canvas"></canvas>
  </div>
</main>

<footer id="hint"></footer>

<div id="modal" hidden>
  <div class="sheet">
    <div class="sheet-head">
      <b>ASCII export</b>
      <button id="close" title="Close (Esc)">×</button>
    </div>
    <textarea id="out" readonly spellcheck="false" wrap="off"></textarea>
    <div class="sheet-foot">
      <span id="stats"></span>
      <button id="download">Download .txt</button>
      <button id="copy" class="primary">Copy to clipboard</button>
    </div>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
